name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Configure signing
        run: |
          KEYSTORE="${{ github.workspace }}/android/horizon-release.keystore"
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    signingConfigs {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            storeFile file(\"${KEYSTORE}\")" >> android/app/build.gradle
          echo "            storePassword \"horizon123\"" >> android/app/build.gradle
          echo "            keyAlias \"horizon\"" >> android/app/build.gradle
          echo "            keyPassword \"horizon123\"" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.release" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: android/app/build/outputs/apk/release/app-release.apk
